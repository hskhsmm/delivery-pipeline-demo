<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배송비 계산 · Delivery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans','Noto Sans KR',sans-serif;color:#24362f;background:#f6f7f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{max-width:1080px;margin:auto;padding:32px 32px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:700;letter-spacing:-1px}.brand span{color:#6c8774}.version{font-size:12px;color:#53655b;border:1px solid #d6ded5;padding:8px 12px;border-radius:20px}main{max-width:1000px;margin:66px auto;padding:0 32px}.eyebrow{font-size:12px;letter-spacing:2px;color:#617b69;font-weight:700}h1{font-size:clamp(32px,5vw,48px);line-height:1.3;letter-spacing:-2px;margin:16px 0} .intro{color:#6c776d;line-height:1.8;margin-bottom:40px}.calculator{display:grid;grid-template-columns:1.1fr 1fr;border:1px solid #dce3d8;border-radius:24px;background:white;overflow:hidden;box-shadow:0 18px 55px #273f2c08}form{padding:40px}label{display:block;font-size:14px;font-weight:600;margin-bottom:14px}.amount{display:flex;align-items:center;border:1px solid #becbbd;border-radius:12px;padding:0 18px;gap:12px}.amount:focus-within{outline:2px solid #496b51;outline-offset:2px}input{width:100%;border:0;outline:none;font:600 28px 'DM Sans',sans-serif;padding:20px 0;color:#24362f;background:transparent}.amount span{color:#7c877d}.hint{font-size:12px;color:#728073;line-height:1.8;min-height:44px;margin:14px 0 24px}button{width:100%;background:#284e3b;color:white;border:0;border-radius:12px;padding:17px;font:600 15px inherit;cursor:pointer}button:hover{background:#193d2b}button:disabled{opacity:.65;cursor:wait}.result{padding:40px;background:#edf2e9;display:flex;flex-direction:column;justify-content:center}.result-title{margin:0 0 28px;font-size:14px;font-weight:600}.row{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;font-size:14px;color:#5a6e5d}.row strong{color:#294534}.total{border-top:1px solid #ccd8c7;padding-top:24px;align-items:center;margin:6px 0 0}.total strong{font-size:30px;letter-spacing:-1px}.status{font-size:12px;color:#526c55;line-height:1.8;margin:22px 0 0;min-height:22px}.error{color:#a13d30}footer{margin-top:24px;display:flex;justify-content:space-between;gap:16px;font-size:12px;color:#7b877b;line-height:1.8}footer a{color:inherit} @media(max-width:650px){header{padding:24px}main{margin:36px auto;padding:0 24px}.calculator{grid-template-columns:1fr}form,.result{padding:28px}footer{flex-direction:column;gap:4px}.intro{font-size:14px}}
</style>
</head>
<body>
<header><div class="brand">delivery<span>.</span></div><span class="version" id="version">버전 확인 중</span></header>
<main>
<div class="eyebrow">SHIPPING CALCULATOR</div>
<h1>배송비까지, 한 번에.</h1>
<p class="intro">주문 금액을 입력하면 배송비와 최종 결제 금액을 확인할 수 있어요.</p>
<div class="calculator">
<form id="quote-form">
<label for="subtotal">주문 금액</label>
<div class="amount"><input id="subtotal" name="subtotal" type="number" inputmode="numeric" min="0" max="999999999" step="1" value="35000" required aria-describedby="policy"><span>원</span></div>
<p class="hint" id="policy">배송 정책을 확인하고 있어요.</p>
<button id="calculate" type="submit">배송비 계산하기 ↗</button>
</form>
<section class="result" aria-label="배송비 계산 결과" aria-live="polite" aria-busy="false" id="result">
<h2 class="result-title">결제 예상 금액</h2>
<div class="row"><span>주문 금액</span><strong id="order-value">—</strong></div>
<div class="row"><span>배송비</span><strong id="shipping-value">—</strong></div>
<div class="row total"><span>합계</span><strong id="total-value">—</strong></div>
<p class="status" id="status">금액을 입력하고 계산하기를 눌러주세요.</p>
</section>
</div>
<footer><span>계산 결과는 현재 배포된 API에서 가져옵니다.</span><a href="/version" target="_blank" rel="noopener">배포 버전 확인 ↗</a></footer>
</main>
<script>
const money = value => new Intl.NumberFormat('ko-KR').format(value) + '원';
const form = document.getElementById('quote-form');
const status = document.getElementById('status');
const button = document.getElementById('calculate');
const result = document.getElementById('result');
const input = document.getElementById('subtotal');
function clearResult() {
  for (const id of ['order-value', 'shipping-value', 'total-value']) document.getElementById(id).textContent = '—';
}
// 입력을 바꾸면 이전 금액의 계산 결과를 지워 혼동을 줄인다.
input.addEventListener('input', () => {
  clearResult();
  status.classList.remove('error');
  status.textContent = '변경한 금액으로 다시 계산해주세요.';
});
async function readJson(path) {
  const response = await fetch(path, {cache: 'no-store', signal: AbortSignal.timeout(10000)});
  if (!response.ok) throw new Error('HTTP ' + response.status);
  return response.json();
}
readJson('/version').then(data => {
  document.getElementById('version').textContent = data.version;
  document.getElementById('policy').textContent = money(data.freeShippingThreshold) + ' 이상 주문하면 무료배송이에요. 기본 배송비는 ' + money(data.standardShippingFee) + '이에요.';
}).catch(() => {
  document.getElementById('version').textContent = '버전 확인 실패';
  document.getElementById('policy').textContent = '배송 정책을 가져오지 못했어요. 페이지를 새로고침해주세요.';
});
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  const subtotal = input.value;
  button.disabled = true;
  input.disabled = true;
  result.setAttribute('aria-busy', 'true');
  status.classList.remove('error');
  status.textContent = '배송비를 계산하고 있어요.';
  clearResult();
  try {
    const quote = await readJson('/shipping-quote?subtotal=' + encodeURIComponent(subtotal));
    document.getElementById('order-value').textContent = money(quote.subtotal);
    document.getElementById('shipping-value').textContent = quote.shippingFee === 0 ? '무료' : money(quote.shippingFee);
    document.getElementById('total-value').textContent = money(quote.total);
    status.textContent = quote.shippingFee === 0 ? '무료배송이 적용됐어요.' : '배송비가 포함된 금액이에요.';
  } catch (error) {
    status.classList.add('error');
    status.textContent = '계산하지 못했어요. 잠시 후 다시 시도해주세요.';
  } finally {
    button.disabled = false;
    input.disabled = false;
    result.setAttribute('aria-busy', 'false');
  }
});
</script>
</body>
</html>
