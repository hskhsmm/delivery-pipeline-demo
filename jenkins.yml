serviceName: delivery-demo
timeoutMinutes: 30

# Gradle 검증 단계에만 전달하는 환경변수입니다.
buildEnv:
  JAVA_TOOL_OPTIONS: '-Xmx1g'
  CI: 'true'

image:
  repository: smini/delivery-pipeline-demo
  credentialsId: dockerhub-publisher

gitOps:
  repository: hskhsmm/delivery-pipeline-gitops
  manifest: apps/delivery-demo/deployment.yaml
  credentialsId: delivery-gitops-publisher
